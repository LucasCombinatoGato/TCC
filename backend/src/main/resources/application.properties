# ==============================================================================
# Camora Backend - Configuração Principal (Produção / Render PostgreSQL)
# ==============================================================================
spring.application.name=camora-backend
server.port=${PORT:8080}

# Banco de Dados PostgreSQL (Render / Variáveis de Ambiente)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/camora_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Inicialização de dados padrão (temáticas)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Segurança / JWT
camora.jwt.secret=${JWT_SECRET:Y2Ftb3JhLXN1cGVyLXNlY3JldC1rZXktMjAyNi1wcm9qZXRvLXRjYy1hdXRoZW50aWNhdGlvbg==}
camora.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (origens permitidas separadas por vírgula)
camora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
